<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Omar Ali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; }
    .nf-num { font-family: var(--font-mono); font-size: clamp(5rem, 18vw, 10rem); font-weight:700;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; line-height:1; }
    .nf-inner { padding: 24px; }
    .nf-inner p { margin: 16px 0 32px; max-width: 420px; margin-left:auto; margin-right:auto; }
  </style>
</head>
<body>
  <div class="ambient ambient--violet"></div>
  <div class="ambient ambient--cyan"></div>
  <main class="nf-inner">
    <div class="nf-num">404</div>
    <h2>Page not found</h2>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back.</p>
    <a href="./" class="btn btn--primary">← Back home</a>
  </main>
</body>
</html>
